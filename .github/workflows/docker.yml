name: Build Universal Firmware & Multi-Arch Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bridge & CLI unit tests
        run: python3 -m unittest discover -s tests -v

  build-firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4

      - name: Build universal ESP32-C5 firmware (NVS-configured, zero secrets)
        run: |
          cd firmware
          VER="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VER="1.0.0-${GITHUB_SHA::7}"; fi
          sed -i "s/set(PROJECT_VER .*)/set(PROJECT_VER \"${VER}\")/" CMakeLists.txt
          idf.py set-target esp32c5
          idf.py build
          mkdir -p ../fw_out
          cp build/sureflap_hub.bin ../fw_out/sureflap_hub.bin
          printf "%s\n" "${VER}" > ../fw_out/ver.txt
          esptool.py --chip esp32c5 merge_bin -o ../fw_out/sureflap_hub_merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x2000 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0xf000 build/ota_data_initial.bin \
            0x20000 build/sureflap_hub.bin
          ls -lh ../fw_out/

      - uses: actions/upload-artifact@v4
        with:
          name: esp32c5-firmware
          path: fw_out/

  build-docker:
    needs: [test, build-firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: esp32c5-firmware
          path: bridge/firmware

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./bridge
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
