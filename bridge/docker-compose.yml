services:
  sureflap-bridge:
    build: .
    # Once published to GHCR, replace `build: .` with:
    # image: ghcr.io/<your-github-username>/sureflap-esp32-hub:latest
    container_name: sureflap-bridge
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/data
    environment:
      # Set to your local timezone so auto-learned keystream matches the flap's clock (e.g. Europe/London, America/New_York)
      - TZ=${TZ:-UTC}
      - SUREFLAP_CONFIG=/data/config.json
      - STATE_FILE=/data/state.json
      - OTA_DIR=/data/ota
      - OTA_ENABLED=true
      # Optional: configure purely via env vars (no config.json required; ESP32_IP is auto-discovered):
      # - ESP32_IP=192.168.1.50
      # - MQTT_HOST=127.0.0.1
      # - MQTT_PORT=1883
      # - PETS=1:CatOne,2:CatTwo
      # - TOGGLE_ON_IN=true
      # - CURFEW_LOCK=18:30
      # - CURFEW_UNLOCK=06:00

  # Optional on-demand ESP-IDF v5.5.6 builder (only needed if you edit firmware/main/main.c):
  #   docker compose --profile build run --rm firmware-builder
  firmware-builder:
    profiles: ["build"]
    build:
      context: ../firmware
      dockerfile: Dockerfile.builder
    volumes:
      - ./data/ota:/output
