services:
  sureflap-bridge:
    image: ghcr.io/simondo/sureflap-esp32-hub:latest
    # To build locally instead (e.g. after editing the bridge), comment out `image:` and use:
    # build: .
    container_name: sureflap-bridge
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/data
    environment:
      # Required: set to your local timezone so auto-learned keystream matches the flap's clock
      # Example: TZ=Europe/London docker compose up -d  (or set TZ in a .env file)
      - TZ=${TZ:?Set TZ to your local timezone, e.g. Europe/London}
      - SUREFLAP_CONFIG=/data/config.json
      - STATE_FILE=/data/state.json
      - OTA_DIR=/data/ota
      - OTA_ENABLED=true
      # Optional: configure purely via env vars (no config.json required; ESP32_IP is auto-discovered):
      # - ESP32_IP=192.168.1.50
      # - MQTT_HOST=127.0.0.1
      # - MQTT_PORT=1883
      # - PETS=1:CatOne,2:CatTwo
      # - TOGGLE_ON_IN=true
      # - CURFEW_LOCK=18:30
      # - CURFEW_UNLOCK=06:00

  # Optional on-demand ESP-IDF v5.5.6 builder (only needed if you edit firmware/main/main.c):
  #   docker compose --profile build run --rm firmware-builder
  firmware-builder:
    profiles: ["build"]
    build:
      context: ../firmware
      dockerfile: Dockerfile.builder
    volumes:
      - ./data/ota:/output
